<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Public Prayers</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="brand">🙏 Prayer Room</div>
            <nav><a href="/">Home</a><a href="/request.html">Submit Prayer</a><a class="active"
                    href="/prayers.html">Public Prayers</a><a href="/room.html">Prayer Room</a>
                    </nav>
        </div>
    </header>
    <main class="container">
        <div class="eyebrow">Community prayers</div>
        <h1>Public Prayers</h1>
        
        <div class="section-title">
            <h2>🙏 Active Prayers</h2><span id="activeCount"></span>
        </div>
        <div id="activeList" class="grid"></div>
        <div class="section-title">
            <h2>✅ Answered Prayers</h2><span id="answeredCount"></span>
        </div>
        <div id="answeredList" class="grid"></div>
    </main>
    <script>const socket = io(); let reactorToken = localStorage.getItem('prayerReactorToken'); if (!reactorToken) { reactorToken = 'web_' + crypto.randomUUID(); localStorage.setItem('prayerReactorToken', reactorToken) } function esc(x) { const d = document.createElement('div'); d.textContent = x ?? ''; return d.innerHTML } function date(x) { return new Date(x).toLocaleString() } function card(p) { const a = Boolean(p.answered_at); return `<article class="card prayer-card ${a ? 'answered' : ''}"><div class="meta"><span>${a ? '✅ Answered Prayer' : '🙏 Prayer Request'}</span><small>🙏 ${p.prayer_count}</small></div><p>${esc(p.request)}</p><div class="author">— ${esc(p.name || 'Anonymous')}<br><small>${date(p.created_at)}</small></div>${a ? `<div class="success">Answered on ${date(p.answered_at)}</div>` : `<div class="admin-actions"><button class="button" onclick="pray(${p.id},this)">🙏</button><button class="button success-button" onclick="answeredPrayer(${p.id},this)">✅ Mark as Answered</button></div>`}</article>` } async function refresh() { try { const r = await fetch('/api/public/prayers'), ps = await r.json(); if (!r.ok) throw new Error(ps.error); const a = ps.filter(p => !p.answered_at), d = ps.filter(p => p.answered_at); activeCount.textContent = `${a.length} request${a.length === 1 ? '' : 's'}`; answeredCount.textContent = `${d.length} prayer${d.length === 1 ? '' : 's'}`; activeList.innerHTML = a.length ? a.map(card).join('') : '<div class="card empty">There are no active public prayer requests right now.</div>'; answeredList.innerHTML = d.length ? d.map(card).join('') : '<div class="card empty">No answered prayers yet.</div>' } catch (e) { activeList.innerHTML = `<div class="card empty">${esc(e.message)}</div>` } } async function pray(id, b) { b.disabled = true; try { const r = await fetch('/api/prayers/' + id + '/react', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reactorToken }) }); const d = await r.json(); if (!r.ok) throw new Error(d.error) } catch (e) { alert(e.message) } finally { b.disabled = false } } async function answeredPrayer(id, b) { if (!confirm('Mark this prayer as answered? It will move to Answered Prayers.')) return; b.disabled = true; try { const r = await fetch('/api/prayers/' + id + '/answered', { method: 'POST' }); const d = await r.json(); if (!r.ok) throw new Error(d.error) } catch (e) { alert(e.message); b.disabled = false } } socket.on('prayer-data-changed', refresh); socket.on('prayerDeleted', refresh); refresh();</script>
</body>

</html>
